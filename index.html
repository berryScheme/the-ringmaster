<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ringmaster</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/game.js" defer></script>   <!-- loads the game code; defer runs it after the page is built, so later code can find the cards -->
</head>

<body>
  <header id="resources">◉ 0</header>                   <!-- top bar; <header> describes its role, and the id lets JS find it later to update coins -->
  <main id="troupe"></main>
  <footer id="actions">                                 <!-- bottom bar; <footer> describes its role -->
    <button>Scavenge</button>                           <!-- real <button> elements work with taps and keyboards with no extra code -->
    <button>Hire · 15</button>
  </footer>
</body>

</html>
