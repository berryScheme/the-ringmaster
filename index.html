<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ringmaster</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
</head>
<body>
    <header id="resources">
        <h1>The Ringmaster</h1>
    </header>
    <main id="stages">
        <section id="stage">
            <h2>Stage</h2>
            <div class="performer-card">
                <div class="name-tag">Galileo</div>
                <button>Perform</button>
                <button>Rest</button>
            </div>
        </section>
        <section id="back-stage">
            <h2>Back Stage (Rest Area)</h2>
            <div class="performer-card">
                <div class="name-tag">Figarro</div>
                <button>Perform</button>
                <button>Rest</button>
            </div>
        </section>
    </main>
    <footer id="player-abilities">
        <button>Scavenge (3 Seconds)</button>
    </footer>

</body>
</html>
