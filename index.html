<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ringmaster</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
</head>
<body>
    <header id="resources">
        <h1>The Ringmaster</h1>
    </header>
    <main id="stages">
        <section id="stage">
            <h2>Stage</h2>
            <div class="performer-card">
                <div class="name-tag">Galileo</div>
                <svg viewBox="0 0 100 100" width="120">
                    <circle class="trick-ring" cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="8"/>
                    <circle class="xp-ring" cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="5"/>
                    <circle class="icon" cx="50" cy="50" r="15" fill="black"/>
                </svg>
                <div class="stamina-bar">
                    <div class="stamina"></div>
                    <div class="damage"></div>
                </div>
                <div class="stamina-counter">Stamina: 100/100</div>
                <button>Perform</button>
                <button>Rest</button>
            </div>
        </section>
        <section id="back-stage">
            <h2>Back Stage (Rest Area)</h2>
            <div class="performer-card">
                <div class="name-tag">Figarro</div>
                <svg viewBox="0 0 100 100" width="120">
                    <circle class="trick-ring" cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="8"/>
                    <circle class="xp-ring" cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="5"/>
                    <circle class="icon" cx="50" cy="50" r="15" fill="black"/>
                </svg>
                <div class="stamina-bar">
                    <div class="stamina"></div>
                    <div class="damage"></div>
                </div>
                <div class="stamina-counter">Stamina: 100/100</div>
                <button>Perform</button>
                <button>Rest</button>
            </div>
        </section>
    </main>
    <footer id="player-abilities">
        <button>Scavenge (3 Seconds)</button>
    </footer>

</body>
</html>
