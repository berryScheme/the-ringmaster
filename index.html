<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ringmaster</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
</head>
<body>
    <header>
        <h1>The Ringmaster</h1>
        <section id="resources">
            <div id="coins-counter"></div>
            <div class="mat-counter" id="wood-counter"></div>
            <div class="mat-counter" id="metal-counter"></div>
            <div class="mat-counter" id="fabric-counter"></div>
            <div class="mat-counter" id="glass-counter"></div>
            <div class="mat-counter" id="clay-counter"></div>
        </section>
    </header>
    <main id="stages">
        <section id="stage">
            <h2>Stage</h2>
            <div class="performer-card">
                <div class="name-tag">Galileo</div>
                <svg viewBox="0 0 100 100" width="120">
                    <g transform="rotate(-90 50 50)">
                        <circle class="trick-ring" cx="50" cy="50" r="40" fill="none" stroke="blue" stroke-width="8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="75"/>
                        <circle class="xp-ring" cx="50" cy="50" r="26" fill="none" stroke="blue" stroke-width="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="70"/>
                    </g>
                    <circle class="icon" cx="50" cy="50" r="18" fill="black"/>
                </svg>
                <div>Level: 1</div>
                <div class="stamina-bar">
                    <div class="stamina"></div>
                    <div class="damage"></div>
                </div>
                <div class="stamina-counter">Stamina: 100/100</div>
                <button>Perform</button>
                <button>Rest</button>
                <button>Heal</button>
            </div>
        </section>
        <section id="back-stage">
            <h2>Back Stage (Rest Area)</h2>
            <div class="performer-card">
                <div class="name-tag">Figarro</div>
                <svg viewBox="0 0 100 100" width="120">
                    <g transform="rotate(-90 50 50)">
                        <circle class="trick-ring" cx="50" cy="50" r="40" fill="none" stroke="blue" stroke-width="8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="75"/>
                        <circle class="xp-ring" cx="50" cy="50" r="26" fill="none" stroke="blue" stroke-width="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="70"/>
                    </g>
                    <circle class="icon" cx="50" cy="50" r="18" fill="black"/>
                </svg>
                <div>Level: 1</div>
                <div class="stamina-bar">
                    <div class="stamina"></div>
                    <div class="damage"></div>
                </div>
                <div class="stamina-counter">Stamina: 100/100</div>
                <button>Perform</button>
                <button>Rest</button>
                <button>Heal</button>
            </div>
        </section>
        <button>Hire</button>
        <button>Expand Stage</button>
    </main>
    <footer id="player-abilities">
        <button>Scavenge (3 Seconds)</button>
    </footer>

</body>
</html>
