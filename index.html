<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Ringmaster</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/game.js" defer></script>   <!-- loads the game code; defer runs it after the page is built, so later code can find the cards -->
</head>

<body>
  <header id="resources">◉ 0</header>                   <!-- top bar; <header> describes its role, and the id lets JS find it later to update coins -->
  <main id="troupe">                                    <!-- the scrolling middle; <main> marks the page's primary content -->
    <div class="card mat-fabric">                                  <!-- same card as before; the material class still sets the color -->
      <div class="name">Pip Wobbleton</div>                        <!-- performer's name above the rings -->
      <svg class="rings" viewBox="0 0 100 100">                    <!-- viewBox: a private 100×100 grid, so the numbers below stay the same at any display size -->
        <circle class="track" cx="50" cy="50" r="46" stroke-width="4"/>     <!-- faint full outer circle: shows the trick ring's whole path; r 46 + half the 4 width = 48, which fits inside 50 -->
        <circle class="fill" cx="50" cy="50" r="46" stroke-width="4"
                pathLength="100" stroke-dashoffset="35"/>                     <!-- outer TRICK ring: offset 35 means 100 − 35 = 65% done (test value) -->
        <circle class="track" cx="50" cy="50" r="37" stroke-width="6"/>     <!-- faint full inner circle, slightly thicker so the two rings read as different -->
        <circle class="fill" cx="50" cy="50" r="37" stroke-width="6"
                pathLength="100" stroke-dashoffset="70"/>                     <!-- inner XP ring: offset 70 means 30% of the way to the next level (test value) -->
        <circle class="icon" cx="50" cy="50" r="28"/>                        <!-- placeholder disc where the performer's picture will go -->
      </svg>
      <div class="level">Lv 2</div>                                <!-- level under the rings, as decided -->
    </div>     <!-- test card: "card" gives the shared shape, "mat-fabric" picks the color -->
    <div class="card mat-wood">                                  <!-- same card as before; the material class still sets the color -->
      <div class="name">Hunk, the Plank</div>                        <!-- performer's name above the rings -->
      <svg class="rings" viewBox="0 0 100 100">                    <!-- viewBox: a private 100×100 grid, so the numbers below stay the same at any display size -->
        <circle class="track" cx="50" cy="50" r="46" stroke-width="4"/>     <!-- faint full outer circle: shows the trick ring's whole path; r 46 + half the 4 width = 48, which fits inside 50 -->
        <circle class="fill" cx="50" cy="50" r="46" stroke-width="4"
                pathLength="100" stroke-dashoffset="80"/>                     <!-- outer TRICK ring: offset 35 means 100 − 35 = 65% done (test value) -->
        <circle class="track" cx="50" cy="50" r="37" stroke-width="6"/>     <!-- faint full inner circle, slightly thicker so the two rings read as different -->
        <circle class="fill" cx="50" cy="50" r="37" stroke-width="6"
                pathLength="100" stroke-dashoffset="10"/>                     <!-- inner XP ring: offset 70 means 30% of the way to the next level (test value) -->
        <circle class="icon" cx="50" cy="50" r="28"/>                        <!-- placeholder disc where the performer's picture will go -->
      </svg>
      <div class="level">Lv 2</div>                                <!-- level under the rings, as decided -->
    </div>         <!-- one test card per material, so you can compare all five at once -->
    <div class="card mat-clay">Clay test</div>
    <div class="card mat-metal">Metal test</div>
    <div class="card mat-glass">Glass test</div>        <!-- five cards should overflow a phone screen, which tests the scrolling too -->
  </main>
  <footer id="actions">                                 <!-- bottom bar; <footer> describes its role -->
    <button>Scavenge</button>                           <!-- real <button> elements work with taps and keyboards with no extra code -->
    <button>Hire · 15</button>
  </footer>
</body>

</html>
